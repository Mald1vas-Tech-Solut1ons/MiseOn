name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - name: Security Scan (npm audit)
        run: npm audit --audit-level=critical || true
      - name: Linting
        run: npm run lint
      - name: Unit Tests
        run: npx vitest run
      - name: Typecheck + build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Nao ha passo de deploy aqui, de proposito.
      #
      # Quem publica e a integracao Git da Vercel, que observa os pushes na
      # main direto. O passo antigo disparava um deploy hook por curl, com o
      # token em texto claro neste arquivo — enquanto o repositorio foi
      # publico, qualquer pessoa podia disparar deploys da producao. O hook
      # foi revogado em 01/09/2026 e o curl passaria a falhar, pintando o CI
      # de vermelho sem nada de errado no codigo.
      #
      # ATENCAO ao que isso significa: a Vercel publica no INSTANTE do push,
      # sem esperar os passos acima. Este workflow deixou de ser um portao e
      # virou um alarme — ele avisa que quebrou, mas depois de ja estar no ar.
      # Push na main vai para o cliente; valide antes de empurrar.

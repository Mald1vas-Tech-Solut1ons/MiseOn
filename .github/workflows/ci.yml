name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      # Portão, não alarme: dependência com vulnerabilidade CRÍTICA bloqueia.
      # Se precisar de exceção documentada, use `npm audit` com allowlist
      # (npm overrides) — nunca volte o `|| true`.
      - name: Auditoria de dependências (npm audit)
        run: npm audit --audit-level=critical
      - name: Linting
        run: npm run lint
      # Edge Functions são Deno, fora do ESLint do front. `deno lint` não
      # precisa de rede — as 41 funções nunca foram lintadas por nada.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint das Edge Functions (Deno)
        run: deno lint supabase/functions
      - name: Regressão do PDF fiscal (HTTP isolado, sem emissão)
        run: deno test --no-lock --node-modules-dir=none --allow-env supabase/functions/fiscal-pdf-nfse/handler_test.ts
      - name: Unit Tests
        run: npx vitest run
      - name: Typecheck + build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Nao ha passo de deploy aqui, de proposito.
      #
      # Quem publica e a integracao Git da Vercel, que observa os pushes na
      # main direto. O deploy via Actions (vercel CLI + token em secret) entra
      # no Sprint 6 do plano CTO, quando este workflow ja estiver verde em
      # tudo — ate la, o CI e o fiscal: "push na main vai para o cliente;
      # valide antes de empurrar".

  # Suíte de integração contra Supabase LOCAL (Docker no runner) — gratuito.
  # Antes desta job os testes de __tests__/integration eram pulados no CI
  # (describe.runIf(Boolean(SERVICE_KEY))): RLS, triggers e RPCs nunca foram
  # exercidos fora da maquina de quem tivesse uma service key a mao.
  # Colateral desejado: db reset aplica as migrations em banco limpo a cada
  # PR — o repo volta a reconstruir o banco (ou o CI mostra exatamente onde
  # para de reconstruir).
  integration:
    name: Integração (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `version: latest` fazia a action perguntar à API do GitHub qual é o
      # último release a cada execução. `secrets.GITHUB_TOKEN` (adicionado em
      # 22/09/2026) sobe a cota de 60 para 1000/h, mas em 23/09/2026 o job
      # ainda caiu com "Failed to resolve latest Supabase CLI release: rate
      # limit exceeded" — a cota é do runner, compartilhada com o resto do
      # mundo que usa o mesmo range de IP, e 1000/h não é infinito. Fixar a
      # versão elimina essa chamada por completo: a action baixa o binário
      # do release já sabido, sem perguntar "qual é o mais novo" toda vez.
      # Atualizar aqui é manual (de propósito — CLI nova sem aviso já quebrou
      # coisa antes); conferir a versão atual em `gh api repos/supabase/cli/releases/latest`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci --no-fund
      # `supabase start` puxa ~11 imagens do ghcr.io (postgres, gotrue, kong,
      # storage-api, edge-runtime...). Anônimo, o ghcr.io também tem cota por
      # IP — em 23/09/2026 o pull falhou em massa com "toomanyrequests" e
      # nenhuma imagem subiu. Login com o GITHUB_TOKEN (só leitura, imagens
      # já são públicas) troca a cota anônima pela cota autenticada, bem maior.
      - name: Autentica no ghcr.io (evita rate limit no pull das imagens)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Subir banco local (migrations + seed)
        run: |
          supabase start
          supabase db reset
          # `status -o env` emite cada VALOR entre aspas duplas e nomes SEM
          # prefixo (API_URL, SERVICE_ROLE_KEY). Jogar a saída crua no
          # $GITHUB_ENV colaria as aspas dentro do valor, e mapear
          # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY apontaria para variáveis
          # que nunca existem — a suíte seria pulada em silêncio e o CI
          # ficaria verde sem testar nada. eval resolve as aspas; os nomes
          # são repassados com os que os testes realmente leem.
          eval "$(supabase status -o env)"
          {
            echo "SB_API_URL=$API_URL"
            echo "SB_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # A ANON_KEY tambem precisa viajar: sem ela o cliente "publico" das
            # suites de contrato de seguranca caia na service role e passava a
            # IGNORAR RLS — teste de RLS rodando como superusuario e falso-verde.
            echo "SB_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - name: Testes de integração
        run: npx vitest run __tests__/integration
        env:
          VITE_SUPABASE_URL: ${{ env.SB_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
          # Gate do falso-verde (ver __tests__/integration/gate.ts): este job
          # promete integração — se a chave não chegar, BLOCKED vira FALHA
          # em vez de suíte sumir do relatório e o CI ficar verde no vazio.
          INTEGRACAO_OBRIGATORIA: '1'

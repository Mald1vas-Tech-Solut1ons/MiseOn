<meta charset="utf-8">
<title>carrossel MiseOn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;padding:0;background:transparent}
  #slide{width:1080px;height:1350px;position:relative;overflow:hidden;
    font-family:Manrope,system-ui,sans-serif;background:#004198}
  .pad{position:absolute;inset:0;padding:96px 88px 120px;display:flex;flex-direction:column}
  /* rodapé de marca, igual em todos os slides */
  .rodape{position:absolute;left:88px;right:88px;bottom:64px;display:flex;
    align-items:center;justify-content:space-between}
  .rodape img{height:52px}
  .pag{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;
    color:rgba(255,255,255,.45);letter-spacing:.08em}
  /* faixa nos tokens oficiais: --miseon-azul-claro e --miseon-laranja */
  .faixa{position:absolute;left:0;top:0;width:100%;height:14px;
    background:linear-gradient(90deg,#0A5CC4 0%,#0A5CC4 45%,#FC5B24 45%,#FC5B24 100%)}
  .fonte{position:absolute;left:88px;right:88px;bottom:150px;
    font-family:"JetBrains Mono",monospace;font-size:19px;line-height:1.45}
</style>
<div id="slide"></div>
<script>
// Tokens do pacote oficial da marca — public/MiseOn brand identity/entrega.
// Nao inventar paleta: o kit do Instagram e a landing ja usam estes valores.
const NAVY='#004198',      // --miseon-azul
      CIANO='#0A5CC4',     // --miseon-azul-claro
      LARANJA='#FC5B24',   // --miseon-laranja
      TINTA='#070C18',     // --miseon-tinta
      NEVOA='#EAF1FB',     // --miseon-nevoa
      BRANCO='#FFFFFF';

// Marca em versão clara para fundo navy: o lockup do sistema é escuro demais
// sobre azul, então o símbolo entra sozinho e o nome vem em tipografia.
function rodape(n, total, escuro){
  const cor = escuro ? 'rgba(10,50,90,.5)' : 'rgba(255,255,255,.45)';
  const nome = escuro ? NAVY : BRANCO;
  return `<div class="rodape">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="marca.png" alt="">
      <span style="font-family:Sora;font-size:30px;font-weight:800;letter-spacing:-.01em;color:${nome}">MiseOn</span>
    </div>
    <span class="pag" style="color:${cor}">${n}/${total}</span>
  </div>`;
}
function creditoFonte(txt, claro){
  const cor = claro ? 'rgba(7,12,24,.40)' : 'rgba(255,255,255,.40)';
  return `<p class="fonte" style="color:${cor}">${txt}</p>`;
}

// ── moldes reutilizáveis ────────────────────────────────────────
// capa: a pergunta ou a afirmação grande, sem enfeite
function capa({olho, linhas, apoio, fundo=NAVY, escuro, tam=104, fonte}){
  const tinta = escuro ? NAVY : BRANCO;
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      ${olho?`<p style="font-family:'JetBrains Mono';font-size:26px;letter-spacing:.18em;
                color:${LARANJA};font-weight:700;margin:0 0 40px">${olho}</p>`:''}
      ${linhas.map(l=>`<h1 style="font-family:Sora;font-size:${tam}px;line-height:.96;font-weight:800;
         color:${l.d?LARANJA:tinta};letter-spacing:-.035em;margin:${l.m||0}px 0 0">${l.t}</h1>`).join('')}
      ${apoio?`<p style="font-size:38px;line-height:1.38;color:${escuro?'#42566B':'rgba(255,255,255,.78)'};
         margin:52px 0 0;max-width:21ch;font-weight:500">${apoio}</p>`:''}
    </div>
    ${fonte?creditoFonte(fonte,escuro):''}`};
}
// declaracao: uma frase só, ocupando a lâmina. Normalmente em laranja.
function declaracao({olho, linhas, apoio, fundo=LARANJA, escuro, tam=92, fonte}){
  const tinta = escuro ? NAVY : BRANCO;
  const dest = fundo===LARANJA ? 'rgba(255,255,255,.72)' : LARANJA;
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      ${olho?`<p style="font-family:'JetBrains Mono';font-size:26px;letter-spacing:.18em;
                color:${fundo===LARANJA?'rgba(255,255,255,.75)':LARANJA};font-weight:700;margin:0 0 40px">${olho}</p>`:''}
      ${linhas.map(l=>`<h2 style="font-family:Sora;font-size:${tam}px;line-height:1.02;font-weight:800;
         color:${l.d?dest:tinta};letter-spacing:-.03em;margin:${l.m||0}px 0 0">${l.t}</h2>`).join('')}
      ${apoio?`<p style="font-size:36px;line-height:1.4;color:${fundo===LARANJA?'rgba(255,255,255,.88)':(escuro?'#42566B':'rgba(255,255,255,.72)')};
         margin:52px 0 0;max-width:20ch;font-weight:500">${apoio}</p>`:''}
    </div>
    ${fonte?creditoFonte(fonte,escuro):''}`};
}
// lista: decomposição de uma soma ou de uma causa
function lista({titulo, itens, pe, fundo=NAVY, escuro, fonte}){
  const tinta = escuro ? NAVY : BRANCO;
  const div = escuro ? '#D5DEE7' : 'rgba(255,255,255,.14)';
  const val = escuro ? LARANJA : NEVOA;
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      <h2 style="font-family:Sora;font-size:64px;line-height:1.08;font-weight:800;color:${tinta};
                 letter-spacing:-.02em;margin:0 0 56px">${titulo}</h2>
      ${itens.map(([a,b])=>`<div style="display:flex;justify-content:space-between;align-items:baseline;
         gap:24px;padding:30px 0;border-bottom:1px solid ${div}">
         <span style="font-size:40px;color:${tinta};font-weight:600">${a}</span>
         <span style="font-family:'JetBrains Mono';font-size:30px;color:${val};font-weight:700;
               text-align:right;flex:none;max-width:44%">${b}</span>
       </div>`).join('')}
      ${pe?`<p style="font-size:36px;line-height:1.4;color:${escuro?'#42566B':'rgba(255,255,255,.66)'};
         margin:52px 0 0;font-weight:500">${pe}</p>`:''}
    </div>
    ${fonte?creditoFonte(fonte,escuro):''}`};
}
// conta: painel de cálculo com linha de resultado
function conta({olho, titulo, linhas, resultado, pe, fundo=BRANCO, escuro=true, fonte}){
  const tinta = escuro ? NAVY : BRANCO;
  const painel = escuro ? NEVOA : 'rgba(255,255,255,.07)';
  const div = escuro ? '#D5DEE7' : 'rgba(255,255,255,.14)';
  const rot = escuro ? '#42566B' : 'rgba(255,255,255,.72)';
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      ${olho?`<p style="font-family:'JetBrains Mono';font-size:26px;letter-spacing:.18em;
                color:${LARANJA};font-weight:700;margin:0 0 40px">${olho}</p>`:''}
      <h2 style="font-family:Sora;font-size:58px;line-height:1.1;font-weight:800;color:${tinta};
                 letter-spacing:-.02em;margin:0 0 52px">${titulo}</h2>
      <div style="background:${painel};border-radius:24px;padding:48px 44px">
        ${linhas.map(([a,b],i)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;
           padding:${i?'26px 0':'0 0 26px'};${i?`border-top:1px solid ${div}`:''}">
           <span style="font-size:36px;color:${rot};font-weight:600">${a}</span>
           <span style="font-family:'JetBrains Mono';font-size:38px;font-weight:700;color:${tinta}">${b}</span>
         </div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:baseline;
             padding-top:26px;border-top:3px solid ${LARANJA}">
          <span style="font-size:36px;color:${tinta};font-weight:800">${resultado[0]}</span>
          <span style="font-family:'JetBrains Mono';font-size:46px;font-weight:700;color:${LARANJA}">${resultado[1]}</span>
        </div>
      </div>
      ${pe?`<p style="font-size:34px;line-height:1.42;color:${rot};margin:44px 0 0;font-weight:500">${pe}</p>`:''}
    </div>
    ${fonte?creditoFonte(fonte,escuro):''}`};
}
// escada: sequência ordenada — a fila do buffet, um fluxo, um passo a passo
function escada({olho, titulo, degraus, pe, fundo=BRANCO, escuro=true, fonte}){
  const tinta = escuro ? NAVY : BRANCO;
  const rot = escuro ? '#42566B' : 'rgba(255,255,255,.7)';
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      ${olho?`<p style="font-family:'JetBrains Mono';font-size:26px;letter-spacing:.18em;
                color:${LARANJA};font-weight:700;margin:0 0 40px">${olho}</p>`:''}
      ${titulo?`<h2 style="font-family:Sora;font-size:56px;line-height:1.1;font-weight:800;color:${tinta};
                 letter-spacing:-.02em;margin:0 0 44px">${titulo}</h2>`:''}
      ${degraus.map(([nome,tag,forte],i)=>`<div style="display:flex;align-items:center;gap:24px;padding:20px 0">
         <span style="font-family:'JetBrains Mono';font-size:24px;font-weight:700;
               color:${forte?LARANJA:rot};width:48px">${String(i+1).padStart(2,'0')}</span>
         <span style="font-family:Sora;font-size:${forte?46:42}px;font-weight:${forte?800:700};
               letter-spacing:-.02em;color:${forte?LARANJA:tinta};flex:none">${nome}</span>
         <span style="font-family:'JetBrains Mono';font-size:22px;font-weight:600;color:${rot};
               text-align:right;flex:1">${tag}</span>
       </div>`).join('')}
      ${pe?`<p style="font-size:34px;line-height:1.4;color:${rot};margin:44px 0 0;font-weight:500">${pe}</p>`:''}
    </div>
    ${fonte?creditoFonte(fonte,escuro):''}`};
}
// citacao: fala de terceiro. Sempre com a fonte visível — é o que autoriza usar.
function citacao({texto, fundo=NAVY, escuro, fonte}){
  const tinta = escuro ? NAVY : BRANCO;
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      <div style="border-left:8px solid ${LARANJA};padding-left:40px">
        <p style="font-size:52px;line-height:1.3;color:${tinta};font-weight:600;margin:0;font-style:italic">
          &ldquo;${texto}&rdquo;</p>
      </div>
    </div>
    ${creditoFonte(fonte,escuro)}`};
}
// recursos: o que o sistema faz, sem adjetivo. Título + descrição por item.
function recursos({titulo, itens, fundo=BRANCO, escuro=true}){
  const tinta = escuro ? NAVY : BRANCO;
  const rot = escuro ? '#42566B' : 'rgba(255,255,255,.72)';
  return {fundo, escuro, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center">
      <h2 style="font-family:Sora;font-size:58px;line-height:1.1;font-weight:800;color:${tinta};
                 letter-spacing:-.02em;margin:0 0 48px">${titulo}</h2>
      ${itens.map(([t,d])=>`<div style="margin-bottom:36px">
        <p style="font-size:38px;font-weight:800;color:${tinta};margin:0 0 8px">${t}</p>
        <p style="font-size:30px;line-height:1.38;color:${rot};margin:0;font-weight:500">${d}</p>
      </div>`).join('')}
    </div>`};
}
// chamada: a lâmina final. Idêntica em todos os carrosséis, de propósito.
function chamada(){
  return {fundo:NAVY, html:`
    <div class="faixa"></div>
    <div class="pad" style="justify-content:center;align-items:center;text-align:center">
      <h2 style="font-family:Sora;font-size:82px;line-height:1.06;font-weight:900;color:${BRANCO};
                 letter-spacing:-.03em;margin:0 0 36px">30 dias grátis</h2>
      <p style="font-size:38px;color:${NEVOA};font-weight:600;margin:0 0 64px">
        sem cartão &middot; sem fidelidade</p>
      <div style="background:${LARANJA};border-radius:999px;padding:30px 66px">
        <span style="font-family:Sora;font-size:42px;font-weight:800;color:${BRANCO}">miseon.app.br</span>
      </div>
      <p style="font-size:30px;line-height:1.45;color:rgba(255,255,255,.6);
                margin:64px 0 0;max-width:22ch;font-weight:500">
        Sistema de gestão para food service que mostra o custo e a margem real
        de cada item.</p>
    </div>`};
}

const CARROSSEIS = {

window.CARROSSEL = {
  lista: Object.keys(CARROSSEIS),
  total(nome){ return CARROSSEIS[nome].length; },
  async montar(nome, i){
    const s = CARROSSEIS[nome][i];
    const total = CARROSSEIS[nome].length;
    const el = document.getElementById('slide');
    el.style.background = s.fundo;
    el.innerHTML = s.html + rodape(i+1, total, !!s.escuro);
    // marca clara sobre navy: inverte só o símbolo, sem tocar no arquivo
    const img = el.querySelector('.rodape img');
    if (img && !s.escuro) img.style.filter = 'brightness(0) invert(1)';
    await document.fonts.ready;
    await new Promise(r => { if (img.complete) r(); else img.onload = r; });
    return true;
  }
};

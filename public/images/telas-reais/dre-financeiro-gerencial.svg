  <text x="56" y="390" font-family="sans-serif" font-weight="700" font-size="14" fill="#38BDF8">2. Receita Líquida Operacional</text>
  <text x="580" y="390" font-family="sans-serif" font-weight="700" font-size="14" fill="#38BDF8">R$ 78.064,00 (82.0%)</text>
  <line x1="56" y1="403" x2="716" y2="403" stroke="#1E293B" stroke-width="1"/>


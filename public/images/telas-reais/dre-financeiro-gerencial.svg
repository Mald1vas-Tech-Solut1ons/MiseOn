  <text x="76" y="510" font-family="sans-serif" font-size="13" fill="#F87171">(-) Despesas Operacionais Fixas (Aluguel, Folha, Luz)</text>
  <text x="580" y="510" font-family="sans-serif" font-weight="600" font-size="13" fill="#F87171">- R$ 23.702,00 (24.9%)</text>
  <line x1="56" y1="523" x2="716" y2="523" stroke="#1E293B" stroke-width="1"/>


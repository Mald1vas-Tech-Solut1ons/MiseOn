  <rect x="56" y="540" width="660" height="44" rx="8" fill="#047857"/>
  <text x="76" y="567" font-family="sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">4. LUCRO LÍQUIDO DO EXERCÍCIO</text>
  <text x="560" y="567" font-family="sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">R$ 24.850,00 (26.1%)</text>

  <!-- RIGHT CHART AREA (420px) -->
  <rect x="756" y="218" width="408" height="438" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="776" y="248" font-family="'Sora', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Composição do Faturamento</text>

  <!-- Mini Bar Chart -->
  <rect x="776" y="280" width="368" height="24" rx="6" fill="#1E293B"/>

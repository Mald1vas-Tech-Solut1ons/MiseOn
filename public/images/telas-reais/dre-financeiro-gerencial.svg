  <text x="56" y="470" font-family="sans-serif" font-weight="700" font-size="14" fill="#A7F3D0">3. Lucro Bruto (Margem de Contribuição)</text>
  <text x="580" y="470" font-family="sans-serif" font-weight="700" font-size="14" fill="#A7F3D0">R$ 48.552,00 (51.0%)</text>

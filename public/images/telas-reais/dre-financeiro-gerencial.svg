  <text x="616" y="152" font-family="sans-serif" font-weight="800" font-size="22" fill="#FB923C">R$ 29.512,00</text>
  <text x="616" y="180" font-family="sans-serif" font-weight="700" font-size="11" fill="#FB923C">31,0% do Faturamento (Ideal: &lt;32%)</text>


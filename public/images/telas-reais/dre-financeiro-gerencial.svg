  <text x="800" y="334" font-family="sans-serif" font-size="12" fill="#94A3B8">Lucro Líquido Real (51%)</text>

  <circle cx="786" cy="355" r="6" fill="#FB923C"/>
  <text x="800" y="359" font-family="sans-serif" font-size="12" fill="#94A3B8">CMV Insumos (31%)</text>

  <circle cx="786" cy="380" r="6" fill="#EF4444"/>
  <text x="800" y="384" font-family="sans-serif" font-size="12" fill="#94A3B8">Deduções &amp; Taxas (18%)</text>


  <text x="260" y="38" font-family="sans-serif" stroke="none" font-weight="600" font-size="12" fill="#94A3B8">| Lançamento Rápido &amp; Fechamento em 3s</text>
  
  <rect x="940" y="14" width="120" height="36" rx="8" fill="#059669"/>
  <text x="960" y="37" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Caixa Aberto</text>

  <rect x="1070" y="14" width="100" height="36" rx="8" fill="#FC5B24"/>
  <text x="1086" y="37" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Sair PDV</text>

  <!-- LEFT: GRID DE PRODUTOS & BUSCA (750px) -->
  <rect x="24" y="88" width="760" height="568" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>


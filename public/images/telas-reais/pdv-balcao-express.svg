  <text x="824" y="170" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">2x Coxinha de Frango Catupiry</text>
  <text x="1105" y="170" font-family="sans-serif" font-weight="700" font-size="14" fill="#94A3B8">R$ 17,00</text>

  <text x="824" y="205" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">1x Refrigerante Coca-Cola Lata</text>
  <text x="1112" y="205" font-family="sans-serif" font-weight="700" font-size="14" fill="#94A3B8">R$ 7,00</text>

  <text x="824" y="240" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">1x Slice Torta Holandesa</text>
  <text x="1105" y="240" font-family="sans-serif" font-weight="700" font-size="14" fill="#94A3B8">R$ 16,00</text>

  <line x1="824" y1="270" x2="1156" y2="270" stroke="#334155" stroke-width="1"/>

  <!-- Total Section -->
  <text x="824" y="310" font-family="sans-serif" font-size="14" fill="#94A3B8">Subtotal (3 itens):</text>
  <text x="1090" y="310" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">R$ 40,00</text>

  <text x="824" y="340" font-family="sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">TOTAL A PAGAR:</text>
  <text x="1070" y="340" font-family="sans-serif" font-weight="800" font-size="22" fill="#10B981">R$ 40,00</text>


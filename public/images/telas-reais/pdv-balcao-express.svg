  <text x="824" y="380" font-family="sans-serif" font-weight="700" font-size="12" fill="#94A3B8">FORMA DE PAGAMENTO RÁPIDA:</text>

  <rect x="824" y="395" width="104" height="40" rx="8" fill="#10B981"/>
  <text x="850" y="420" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">⚡ PIX</text>

  <rect x="936" y="395" width="110" height="40" rx="8" fill="#3B82F6"/>
  <text x="955" y="420" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">💳 DÉBITO</text>

  <rect x="1054" y="395" width="102" height="40" rx="8" fill="#8B5CF6"/>

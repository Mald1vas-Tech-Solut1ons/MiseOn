  <text x="302" y="374" font-family="sans-serif" font-size="12" fill="#94A3B8">Grão Gourmet Arábica</text>
  <text x="302" y="412" font-family="sans-serif" font-weight="800" font-size="18" fill="#FC5B24">R$ 6,50</text>

  <!-- Product 6 -->
  <rect x="528" y="324" width="236" height="136" rx="10" fill="#182232" stroke="#334155" stroke-width="1"/>
  <text x="544" y="354" font-family="sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">Slice Torta Holandesa</text>

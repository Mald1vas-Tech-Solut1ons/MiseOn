  <text x="544" y="260" font-family="sans-serif" font-weight="800" font-size="18" fill="#FC5B24">R$ 7,00</text>
  <rect x="674" y="240" width="74" height="30" rx="6" fill="#FC5B24"/>
  <text x="689" y="260" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">+ Add</text>


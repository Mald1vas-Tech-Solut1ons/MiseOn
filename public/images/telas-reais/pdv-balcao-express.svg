  <text x="60" y="222" font-family="sans-serif" font-size="12" fill="#94A3B8">Com Catupiry Original</text>
  <text x="60" y="260" font-family="sans-serif" font-weight="800" font-size="18" fill="#FC5B24">R$ 8,50</text>
  <rect x="180" y="240" width="74" height="30" rx="6" fill="#FC5B24"/>
  <text x="195" y="260" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">+ Add</text>

  <!-- Product 2 -->
  <rect x="286" y="172" width="226" height="136" rx="10" fill="#182232" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>

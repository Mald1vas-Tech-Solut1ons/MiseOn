<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg-grad-gps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bg-grad-gps)"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#1E293B"/>
  <text x="36" y="38" font-family="'Sora', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">Gestão de Entregas &amp; Rota GPS Motoboy</text>
  <text x="420" y="38" font-family="sans-serif" font-weight="600" font-size="12" fill="#94A3B8">| Rastreamento ao Vivo de Entregadores &amp; Taxa por Raio KM</text>

  <!-- LEFT: MAPA GPS INTERATIVO (760px) -->
  <rect x="24" y="88" width="760" height="568" rx="12" fill="#090E17" stroke="#1E293B" stroke-width="1"/>

  <!-- Simulated Map Roads (Grid / Paths) -->
  <path d="M 50 200 L 730 200 M 50 380 L 730 380 M 50 520 L 730 520 M 200 100 L 200 620 M 450 100 L 450 620 M 650 100 L 650 620" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 200 200 L 450 380 L 650 520" stroke="#FC5B24" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Store Pin (Origem) -->
  <circle cx="200" cy="200" r="16" fill="#FC5B24"/>
  <circle cx="200" cy="200" r="6" fill="#FFFFFF"/>
  <rect x="150" y="150" width="100" height="30" rx="6" fill="#1E293B" filter="url(#shadow)"/>
  <text x="165" y="170" font-family="sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">🏠 Sua Loja</text>

  <!-- Motoboy Pin 1 (Em Trânsito) -->
  <circle cx="450" cy="380" r="18" fill="#3B82F6"/>
  <text x="444" y="385" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">🏍️</text>
  <rect x="380" y="325" width="140" height="34" rx="6" fill="#1E293B" filter="url(#shadow)"/>
  <text x="392" y="346" font-family="sans-serif" font-weight="700" font-size="11" fill="#60A5FA">Carlos • A 1,2 km</text>

  <!-- Destination Pin (Cliente) -->
  <circle cx="650" cy="520" r="16" fill="#10B981"/>
  <circle cx="650" cy="520" r="6" fill="#FFFFFF"/>
  <rect x="580" y="550" width="140" height="34" rx="6" fill="#1E293B" filter="url(#shadow)"/>
  <text x="592" y="571" font-family="sans-serif" font-weight="700" font-size="11" fill="#34D399">Cliente #1042 • ETA 8m</text>

  <!-- Map Radius Overlay -->
  <circle cx="200" cy="200" r="280" fill="#FC5B24" opacity="0.05" stroke="#FC5B24" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="300" y="120" font-family="sans-serif" font-size="11" fill="#FC5B24">Raio 1 (Até 3km - R$ 8,00)</text>

  <!-- RIGHT: SIDEBAR PEDIDOS EM ENTREGA (380px) -->
  <rect x="804" y="88" width="372" height="568" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="804" y="88" width="372" height="44" rx="12" fill="#1E293B"/>
  <text x="824" y="115" font-family="'Sora', sans-serif" font-weight="700" font-size="15" fill="#F8FAFC">Entregas em Andamento (3)</text>

  <!-- Delivery Item 1 -->
  <rect x="820" y="148" width="340" height="130" rx="10" fill="#182232" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="836" y="176" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">#1042 • Gabriel Vasconcelos</text>
  <text x="836" y="196" font-family="sans-serif" font-size="12" fill="#94A3B8">Endereço: Av. Paulista, 1000 - Ap 42</text>
  <text x="836" y="214" font-family="sans-serif" font-size="12" fill="#94A3B8">Distância: 3,4 km • Taxa: R$ 12,00</text>
  <rect x="836" y="230" width="130" height="24" rx="12" fill="#3B82F6" opacity="0.3"/>
  <text x="848" y="246" font-family="sans-serif" font-weight="700" font-size="11" fill="#60A5FA">Motoboy: Carlos</text>

  <!-- Delivery Item 2 -->
  <rect x="820" y="294" width="340" height="130" rx="10" fill="#182232" stroke="#334155" stroke-width="1"/>
  <text x="836" y="322" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">#1044 • Mariana Silva</text>
  <text x="836" y="342" font-family="sans-serif" font-size="12" fill="#94A3B8">Endereço: Rua Augusta, 450</text>
  <text x="836" y="360" font-family="sans-serif" font-size="12" fill="#94A3B8">Distância: 1,8 km • Taxa: R$ 8,00</text>
  <rect x="836" y="376" width="140" height="24" rx="12" fill="#10B981" opacity="0.3"/>
  <text x="848" y="392" font-family="sans-serif" font-weight="700" font-size="11" fill="#34D399">Aguardando Alocação</text>

  <!-- Dispatch Button -->
  <rect x="820" y="580" width="340" height="48" rx="10" fill="#FC5B24"/>
  <text x="880" y="610" font-family="'Sora', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">ALOCAR MOTOBOY MAIS PRÓXIMO</text>

</svg>

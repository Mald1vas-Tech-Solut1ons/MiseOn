
# ── iFood ──────────────────────────────────────────────────────────────────
# O iFood bate no webhook sem nenhum JWT do Supabase → verify_jwt = false é OBRIGATÓRIO.
# Sem isso a função retorna 401 e o iFood marca o webhook como falho.
[functions.ifood-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/ifood-webhook/index.ts"

# A autenticação do lojista é feita dentro da função (fn_sou_admin) → pode exigir JWT.
[functions.ifood-auth]
enabled = true
verify_jwt = false
entrypoint = "./functions/ifood-auth/index.ts"

[functions.magic-copy]
enabled = true
verify_jwt = true
entrypoint = "./functions/magic-copy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/magic-copy/*.html" ]

[functions.ai-gerar-descricao]
enabled = true
verify_jwt = true
import_map = "./functions/ai-gerar-descricao/deno.json"
entrypoint = "./functions/ai-gerar-descricao/index.ts"

[functions.pix-criar-cobranca]
enabled = true
verify_jwt = true
entrypoint = "./functions/pix-criar-cobranca/index.ts"


[functions.whatsapp-webhook]
enabled = true
verify_jwt = false

[functions.whatsapp-worker]
enabled = true
verify_jwt = true

[functions.whatsapp-conectar]
enabled = true
verify_jwt = true

# ── Entradas que faltavam ──────────────────────────────────────────────────
# Estas três funções existiam em produção mas não constavam aqui. Como o
# default do CLI é verify_jwt = true, um `functions deploy` passaria a exigir
# JWT em pix-webhook (a Efí chama sem JWT) e em chat-ai-reception, derrubando
# a confirmação de pagamento e o chat da vitrine. Valores conferidos contra o
# que está ATIVO em produção antes de escrever.
[functions.pix-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/pix-webhook/index.ts"

[functions.chat-ai-reception]
enabled = true
verify_jwt = false
entrypoint = "./functions/chat-ai-reception/index.ts"

[functions.nutricao-estimar-ia]
enabled = true
verify_jwt = true
entrypoint = "./functions/nutricao-estimar-ia/index.ts"
